<head>
<meta charset="utf-8">

<meta name="theme-color" content="#d6336c">
<meta property="og:title" content="สระใส พูลวิลล่า">
<meta property="og:description" content="จองพูลวิลล่าสระส่วนตัวทั้งหลัง ดูราคาทุกคืน รวมภาษีแล้ว">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d6336c'/%3E%3Cpath d='M6 19c3-3 5-3 8 0s5 3 8 0 3-2 4-1' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M6 13c3-3 5-3 8 0s5 3 8 0 3-2 4-1' fill='none' stroke='white' stroke-opacity='.6' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}

</style>
<title>สระใส พูลวิลล่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Mali:wght@500;600;700&display=swap">
<style>
/* Layout concept: pool-tile hero with live search, card grid of villas, full-screen sheet per villa with a sticky booking card, then checkout and confirmation. */
:root{
  --bg:#fff1f6; --surface:#ffffff; --surface-2:#ffe1ec; --ink:#4a1d33; --muted:#865a70; --line:#f6cadb;
  --accent:#d6336c; --accent-ink:#ffffff; --accent-soft:#ffdce9; --tile:#ffd9e6;
  --good:#1f7a4d; --warn:#a85600; --bad:#c0222f; --scrim:rgba(58,13,32,.55);
  --font-display:'Mali','Noto Sans Thai',system-ui,sans-serif;
  --font-body:'Noto Sans Thai','Mali',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241019; --surface:#341626; --surface-2:#451c30; --ink:#ffe9f1; --muted:#dba9bf; --line:#5e2b44;
    --accent:#ff7eb0; --accent-ink:#3a0d20; --accent-soft:#50203a; --tile:#3b1a2b;
    --good:#6fdc9f; --warn:#f0b45a; --bad:#ff8a80; --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241019; --surface:#341626; --surface-2:#451c30; --ink:#ffe9f1; --muted:#dba9bf; --line:#5e2b44;
  --accent:#ff7eb0; --accent-ink:#3a0d20; --accent-soft:#50203a; --tile:#3b1a2b;
  --good:#6fdc9f; --warn:#f0b45a; --bad:#ff8a80; --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.65;
  padding-block:0 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums;
}
h1,h2,h3{font-family:var(--font-display); font-weight:600; line-height:1.3; margin:0; text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1180px; margin:0 auto}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button{font:inherit; color:inherit}

/* top bar */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 0; flex-wrap:wrap}
.brand{font-family:var(--font-display); font-weight:600; font-size:22px; text-decoration:none; color:var(--ink); display:flex; align-items:center; gap:10px}
.brand svg{width:30px; height:30px; flex:none}
.nav{display:flex; gap:6px}
.nav a{padding:8px 14px; border-radius:999px; text-decoration:none; color:var(--ink); font-weight:500}
.nav a[aria-current="page"]{background:var(--accent-soft); color:var(--ink)}
.nav .count{display:inline-block; min-width:22px; padding:0 6px; margin-left:6px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-size:12px; text-align:center}

/* hero */
.hero{
  border:1px solid var(--line); border-radius:28px; padding:clamp(20px,4vw,40px);
  background:
    linear-gradient(var(--tile) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,var(--tile) 1px,transparent 1px) 0 0/32px 32px,
    var(--surface);
}
.eyebrow{font-size:13px; letter-spacing:.06em; color:var(--muted); font-weight:500; margin-bottom:8px}
.hero h1{font-size:clamp(28px,5vw,46px); max-width:16ch}
.lead{max-width:60ch; color:var(--muted); margin-top:12px}
.search{margin-top:24px; display:grid; grid-template-columns:2fr 1.3fr 1.3fr 1fr; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:14px}
.field{min-width:0}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
input,select,textarea{width:100%; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:9px 12px; min-height:44px}
textarea{min-height:88px; resize:vertical}
input[type=range]{padding:0; min-height:32px; accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto; min-height:0; accent-color:var(--accent)}

.filters{display:flex; flex-wrap:wrap; gap:16px 24px; align-items:end; margin:22px 0 14px}
.filters .field{min-width:150px; flex:0 1 220px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; cursor:pointer; min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.meta{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--muted); margin:6px 0 14px}

/* buttons */
.btn{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 16px; cursor:pointer; min-height:44px; font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.btn.primary:disabled{opacity:.45; cursor:not-allowed}
.btn.danger{color:var(--bad); border-color:var(--bad)}
.btn.small{min-height:36px; padding:4px 12px; font-size:14px}
.btn.block{width:100%}

/* villa cards */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:20px}
.vcard{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:24px; overflow:hidden; text-decoration:none; color:var(--ink); min-width:0}
.vcard:hover{border-color:var(--accent)}
.vcard .img{display:block; aspect-ratio:3/2; background:var(--surface-2); position:relative}
.vcard .img svg,.gal-main svg,.gal-th svg{display:block; width:100%; height:100%}
.tag{position:absolute; left:10px; top:10px; background:var(--surface); color:var(--ink); border-radius:999px; padding:2px 12px; font-size:13px; font-weight:500}
.vbody{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1}
.vbody h3{font-size:18px}
.specs{color:var(--muted); font-size:14px}
.rate{font-weight:600; font-size:14px}
.rate span{color:var(--muted); font-weight:400}
.pricebox{margin-top:auto; padding-top:10px; border-top:1px dashed var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap}
.pricebox strong{font-family:var(--font-display); font-size:20px}
.pricebox small{color:var(--muted)}
.note-min{color:var(--warn); font-size:13px}
.empty{padding:36px 20px; text-align:center; border:1px dashed var(--line); border-radius:14px; color:var(--muted)}
.empty h3{color:var(--ink); margin-bottom:6px}
.empty .btn{margin-top:14px}

/* overlay */
.overlay{position:fixed; inset:0; z-index:50; background:var(--scrim); overflow-y:auto; overscroll-behavior:contain;
  padding-top:max(12px,env(safe-area-inset-top,0px)); padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px)); padding-right:max(12px,env(safe-area-inset-right,0px))}
.panel{max-width:1120px; margin:0 auto; background:var(--bg); border-radius:28px; padding:clamp(14px,3vw,28px); position:relative}
.panel:focus{outline:none}
.pbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px}
.crumbs{color:var(--muted); font-size:14px}
.crumbs b{color:var(--ink)}
.dgrid{display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:32px; align-items:start}
.gal-main{aspect-ratio:16/9; border-radius:24px; overflow:hidden; background:var(--surface-2)}
.gal-ths{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px}
.gal-th{aspect-ratio:16/9; border-radius:10px; overflow:hidden; border:2px solid transparent; padding:0; cursor:pointer; background:var(--surface-2)}
.gal-th[aria-pressed="true"]{border-color:var(--accent)}
.dtitle{margin-top:20px; display:flex; flex-direction:column; gap:6px}
.dtitle h2{font-size:clamp(24px,3.6vw,34px)}
.facts{display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--muted)}
.facts b{color:var(--ink)}
.sec{margin-top:28px}
.sec h3{font-size:19px; margin-bottom:10px}
.am{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px 20px}
.am li{display:flex; gap:10px; align-items:center}
.am li::before{content:""; width:7px; height:7px; flex:none; background:var(--accent); border-radius:2px; transform:rotate(45deg)}
.rules{margin:0; padding-left:20px; display:grid; gap:4px}
table.pol{border-collapse:collapse; width:100%; max-width:520px}
table.pol td{padding:8px 12px; border-bottom:1px solid var(--line)}
table.pol td:last-child{text-align:right; font-weight:600}
.rev{border-top:1px solid var(--line); padding:12px 0}
.rev b{margin-right:8px}
.rev small{color:var(--muted)}
.sample{font-size:13px; color:var(--muted); margin-top:6px}

/* booking card */
.card{background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:18px; position:sticky; top:12px; display:grid; gap:14px}
.card .ph{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.card .ph strong{font-family:var(--font-display); font-size:24px}
.card .ph small{color:var(--muted)}
.dpick{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.dpick div{padding:8px 12px; min-width:0}
.dpick div+div{border-left:1px solid var(--line)}
.dpick small{display:block; color:var(--muted); font-size:12px}
.dpick span{font-weight:600}
.cal-head{display:flex; justify-content:space-between; align-items:center}
.cal-head button{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:18px}
.cal-head button:disabled{opacity:.3; cursor:not-allowed}
.cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; margin-top:6px}
.cal-grid .dw{text-align:center; font-size:12px; color:var(--muted); padding:4px 0}
.day{border:0; background:transparent; border-radius:8px; padding:3px 0 4px; min-height:48px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.2}
.day b{font-weight:600}
.day i{font-style:normal; font-size:10.5px; color:var(--muted)}
.day:hover:not(:disabled){background:var(--accent-soft)}
.day.hol i{color:var(--warn); font-weight:600}
.day.busy,.day.past{cursor:not-allowed; color:var(--muted)}
.day.busy b{text-decoration:line-through}
.day.busy i,.day.past i{visibility:hidden}
.day.past{opacity:.45}
.day.range{background:var(--accent-soft); border-radius:0}
.day.start,.day.end{background:var(--accent); color:var(--accent-ink); border-radius:8px}
.day.start i,.day.end i{color:var(--accent-ink)}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--muted)}
.legend span::before{content:""; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--line)}
.legend .l-ok::before{background:var(--accent-soft); border:1px solid var(--accent)}
.legend .l-busy::before{background:var(--muted)}
.legend .l-hol::before{background:var(--warn)}
.msg{font-size:14px; min-height:22px}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--good)}
.stepper{display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--line); border-radius:10px; padding:6px 6px 6px 14px}
.stepper .sv{display:flex; align-items:center; gap:6px}
.stepper button{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:18px}
.stepper button:disabled{opacity:.35; cursor:not-allowed}
.stepper output{min-width:28px; text-align:center; font-weight:600}
details.add{border:1px solid var(--line); border-radius:10px; padding:8px 14px}
details.add summary{cursor:pointer; font-weight:500; min-height:32px; display:flex; align-items:center}
.addrow{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-top:1px dashed var(--line)}
.addrow label{flex:1; cursor:pointer}
.addrow small{display:block; color:var(--muted)}
.coupon{display:flex; gap:8px}
.coupon input{text-transform:uppercase}
.lines{display:grid; gap:6px; font-size:14.5px}
.lines .ln{display:flex; justify-content:space-between; gap:12px}
.lines .ln span:last-child{white-space:nowrap}
.lines .neg span:last-child{color:var(--good)}
.lines .tot{border-top:1px solid var(--line); padding-top:10px; font-weight:600; font-size:17px}
.lines .sub{color:var(--muted); font-size:13px}
details.nights{font-size:13.5px; color:var(--muted)}
details.nights summary{cursor:pointer}
details.nights div{display:flex; justify-content:space-between; padding:2px 0}
.kind{display:inline-block; font-size:11px; padding:0 7px; border-radius:999px; background:var(--accent-soft); color:var(--ink); margin-left:6px}
.kind.hol{background:var(--warn); color:var(--surface)}
.mbar{display:none}

/* checkout */
.cgrid{display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:32px; align-items:start}
.form{display:grid; gap:16px}
.form .two{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.fs{border:1px solid var(--line); border-radius:22px; padding:16px; background:var(--surface); display:grid; gap:14px; min-width:0}
.fs h3{font-size:17px}
.err-t{color:var(--bad); font-size:13px; margin-top:3px}
.opt{display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer}
.opt:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.opt.off{opacity:.5; cursor:not-allowed}
.opt b{display:block}
.opt small{color:var(--muted)}
.hold{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--accent-soft); border-radius:10px; padding:10px 14px; font-weight:500}
.hold output{font-family:var(--font-display); font-size:22px; font-variant-numeric:tabular-nums}
.hold.exp{background:var(--surface-2); color:var(--bad)}
.qrbox{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.qrbox svg{width:150px; height:150px; border:1px solid var(--line); border-radius:8px; background:#fff; flex:none}
.qrbox p{flex:1; min-width:180px; color:var(--muted); font-size:14px}
.done-hero{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(18px,4vw,32px)}
.ref{display:inline-flex; align-items:center; gap:10px; margin-top:12px; padding:8px 8px 8px 16px; border-radius:10px; background:var(--accent-soft); font-family:var(--font-display); font-size:20px; letter-spacing:.06em}
.steps{display:grid; gap:10px; margin:18px 0 0; padding:0; list-style:none}
.steps li{display:grid; grid-template-columns:150px 1fr; gap:12px; padding-top:10px; border-top:1px solid var(--line)}
.steps li span:first-child{color:var(--muted)}

/* my bookings */
.bk{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:16px; display:grid; grid-template-columns:150px minmax(0,1fr); gap:16px; margin-bottom:14px}
.bk .thumb{border-radius:10px; overflow:hidden; aspect-ratio:3/2; align-self:start}
.bk .thumb svg{display:block; width:100%; height:100%}
.bk h3{font-size:18px}
.bk .row{display:flex; flex-wrap:wrap; gap:4px 18px; color:var(--muted); margin-top:4px}
.bk .row b{color:var(--ink)}
.bk .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.st{display:inline-block; font-size:12.5px; font-weight:600; padding:1px 10px; border-radius:999px; margin-left:8px; vertical-align:2px; background:var(--accent-soft)}
.st.can{background:var(--surface-2); color:var(--muted)}
.cfm{margin-top:12px; padding:12px 14px; border:1px solid var(--bad); border-radius:10px; display:grid; gap:10px}
.due{color:var(--warn); font-weight:600}
.foot{margin-top:40px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13.5px; max-width:80ch}

@media (max-width:900px){
  .dgrid,.cgrid{grid-template-columns:minmax(0,1fr)}
  .card{position:static}
  .search{grid-template-columns:1fr 1fr}
  .mbar{display:flex; position:sticky; bottom:0; justify-content:space-between; align-items:center; gap:12px; margin:20px calc(-1 * clamp(14px,3vw,28px)) calc(-1 * clamp(14px,3vw,28px)); padding:12px clamp(14px,3vw,28px) 12px; background:var(--surface); border-top:1px solid var(--line); border-radius:0 0 18px 18px}
  .mbar strong{font-family:var(--font-display); font-size:18px}
  .mbar small{display:block; color:var(--muted); line-height:1.3}
}
@media (max-width:560px){
  .search{grid-template-columns:1fr}
  .form .two{grid-template-columns:1fr}
  .bk{grid-template-columns:1fr}
  .steps li{grid-template-columns:1fr; gap:2px}
  .filters .field{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#home" aria-label="สระใส พูลวิลล่า หน้าแรก">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="var(--accent)"/><path d="M6 19c3-3 5-3 8 0s5 3 8 0 3-2 4-1" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/><path d="M6 13c3-3 5-3 8 0s5 3 8 0 3-2 4-1" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" opacity=".6"/></svg>
      สระใส พูลวิลล่า
    </a>
    <nav class="nav" aria-label="เมนูหลัก">
      <a href="#home" id="nav-home">ค้นหาวิลล่า</a>
      <a href="#bookings" id="nav-bk">การจองของฉัน<span class="count" id="nav-count" hidden>0</span></a>
    </nav>
  </header>
  <main id="view"></main>
  <footer class="foot">ระบบตัวอย่างโดยใช้ AI</footer>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var $=function(s,el){return (el||document).querySelector(s)};
var TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var TH_MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
var DOWF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function pad(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}

function isHoliday(s){for(var i=0;i<HOLIDAYS.length;i++){if(s>=HOLIDAYS[i][0]&&s<=HOLIDAYS[i][1])return true}return false}
function nightPrice(v,s){
  var dow=pd(s).getDay(), base=(dow===5||dow===6)?v.we:v.wd;
  if(isHoliday(s)) return {price:Math.round(Math.max(base,v.we)*1.35/100)*100,kind:'hol'};
  return {price:base,kind:(dow===5||dow===6)?'we':'wd'};
}
var KIND_T={hol:'วันหยุดยาว',we:'สุดสัปดาห์',wd:'วันธรรมดา'};
var cache={};
function seeded(v){
  var r=rng(v.id*9301+49297),set={},off=1+Math.floor(r()*4);
  while(off<400){
    var len=2+Math.floor(r()*3);
    for(var i=0;i<len;i++)set[addDays(TODAY,off+i)]=1;
    off+=len+Math.max(1,Math.round((1+r()*7)/v.demand));
  }
  if(v.demand>1.3){['2026-12-30','2026-12-31','2027-01-01'].forEach(function(d){set[d]=1})}
  return set;
}
function busySet(v){
  if(cache[v.id])return cache[v.id];
  var set=seeded(v);
  loadBookings().forEach(function(b){
    if(b.villaId!==v.id||b.cancelled)return;
    for(var d=b.checkin;d<b.checkout;d=addDays(d,1))set[d]=1;
  });
  cache[v.id]=set;return set;
}
function rangeFree(v,a,b){
  if(a<TODAY||b>addDays(HORIZON,1))return false;
  var set=busySet(v);
  for(var d=a;d<b;d=addDays(d,1)){if(set[d])return false}
  return true;
}
function policyPct(key,days){
  var rules=POLICIES[key].rules;
  for(var i=0;i<rules.length;i++){if(days>=rules[i][0])return rules[i][1]}
  return 0;
}
function quote(v,ci,co,g,adds,code){
  if(!ci||!co)return null;
  var n=diff(ci,co);if(n<1)return null;
  var nights=[],stay=0,i;
  for(i=0;i<n;i++){var d=addDays(ci,i),p=nightPrice(v,d);nights.push({d:d,price:p.price,kind:p.kind});stay+=p.price}
  var extraG=Math.max(0,g-v.base),extraFee=extraG*v.extra*n;
  var lead=diff(TODAY,ci),best={label:'',pct:0};
  if(n>=5)best={label:'พักตั้งแต่ 5 คืน ลด 10%',pct:.10};else if(n>=3)best={label:'พักตั้งแต่ 3 คืน ลด 5%',pct:.05};
  if(lead>=30&&best.pct<.05)best={label:'จองล่วงหน้า 30 วัน ลด 5%',pct:.05};
  var auto={label:best.label,amt:Math.round(stay*best.pct)};
  var coupon=null,c=code&&COUPONS[code];
  if(c&&n>=c.min){coupon={label:c.label,amt:c.pct?Math.round((stay-auto.amt)*c.pct):c.off}}
  var ad=[],addTotal=0;
  ADDONS.forEach(function(a){
    if(!adds[a.id])return;
    var qty=a.unit==='night'?n:a.unit==='pn'?n*g:1;
    ad.push({name:a.name,qty:qty,unit:a.unit,amt:a.price*qty});addTotal+=a.price*qty;
  });
  var total=stay+extraFee+v.clean+addTotal-auto.amt-(coupon?coupon.amt:0);
  return {n:n,nights:nights,stay:stay,extraG:extraG,extraFee:extraFee,clean:v.clean,auto:auto,coupon:coupon,ad:ad,total:total,vat:Math.round(total*7/107),
    free:rangeFree(v,ci,co),minOk:n>=v.min,gOk:g<=v.max};
}

function qrSvg(seed){

  }

  });

function pickDate(s){
  var v=S.villa,x=S.sel;x.msg='';x.msgKind='';
  var a=x.checkin,b=x.checkout,busy=busySet(v);
  function startAt(d){if(d>=TODAY&&d<=HORIZON&&!busy[d]){x.checkin=d;x.checkout='';return true}return false}
  if(!a||(a&&b)){startAt(s);return}
  if(s<=a){startAt(s);return}
  if(!rangeFree(v,a,s)){
    x.msg='ช่วงที่เลือกมีวันที่ไม่ว่าง เลือกวันเช็คเอาต์ใหม่';x.msgKind='err';

  }

  x.checkout=s;
}

function startHold(){
  stopHold();

  S.hold.timer=setInterval(tickHold,1000);
  tickHold();
}
function stopHold(){if(S.hold&&S.hold.timer)clearInterval(S.hold.timer);S.hold=null}
function tickHold(){
  if(!S.hold)return;
  var left=Math.max(0,S.hold.until-Date.now());
  if(left<=0&&!S.hold.expired){S.hold.expired=true;clearInterval(S.hold.timer)}
  if(S.hold.expired){
    var b=$('#holdbox');if(b&&!b.classList.contains('exp')){b.classList.add('exp');b.innerHTML='<span>หมดเวลาถือครองวันที่ กรุณาเริ่มใหม่</span><button type="button" class="btn small" data-act="restart">เริ่มใหม่</button>'}
    var pb=$('#paybtn');if(pb)pb.disabled=true;
    return;
  }
  var el=$('#holdt');
  if(el)el.textContent=pad(Math.floor(left/60000))+':'+pad(Math.floor(left/1000)%60);
}

function validateForm(){
  var f=S.form,e={};
  if(f.name.trim().length<2)e.name='กรอกชื่อ-นามสกุล';
  var ph=f.phone.replace(/[\s-]/g,'');
  if(!/^0\d{8,9}$/.test(ph))e.phone='กรอกเบอร์โทรไทย 9–10 หลัก เช่น 0812345678';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim()))e.email='กรอกอีเมลให้ถูกต้อง';
  if(!f.agree)e.agree='ต้องยอมรับก่อนจอง';
  f.errs=e;return Object.keys(e).length===0;
}

  var bk=e.target.closest('[data-bk]');
  if(bk){
    var a=bk.getAttribute('data-bk'),ref=bk.getAttribute('data-ref'),b=ref&&bookingByRef(ref);
    if(a==='cancel'){S.cancelOpen=ref}
    else if(a==='cancel-no'){S.cancelOpen=''}
    else if(a==='cancel-yes'&&b){var v=villaById(b.villaId),pct=policyPct(v.policy,diff(TODAY,b.checkin));b.cancelled=true;b.refund=Math.round(b.paid*pct/100);S.cancelOpen='';saveBookings()}
    else if(a==='payrest'&&b){b.paid=b.total;saveBookings()}
    else if(a==='clear'){MEM=[];saveBookings();S.cancelOpen=''}
    showBookings();
  }
});
ov.addEventListener('click',function(e){
  if(e.target===ov){location.hash='home';return}
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),x=S.sel,v=S.villa;
  if(a==='close'){location.hash='home';return}
  if(a==='img'){x.img=+t.getAttribute('data-i');$('#gal').innerHTML=galleryHTML(v);return}
  if(a==='prev'||a==='next'){var d=new Date(S.cal.y,S.cal.m+(a==='next'?1:-1),1);S.cal={y:d.getFullYear(),m:d.getMonth()};renderCard();return}
  if(a==='pick'){pickDate(t.getAttribute('data-d'));renderCard();return}
  if(a==='gm'||a==='gp'){x.guests=Math.max(1,Math.min(v.max,x.guests+(a==='gp'?1:-1)));renderCard();return}
  if(a==='apply'){
    var code=(x.couponText||'').trim().toUpperCase();x.couponErr='';
    if(!code){x.coupon='';x.couponErr='กรอกรหัสส่วนลดก่อน'}
    else if(!COUPONS[code]){x.coupon='';x.couponErr='ไม่พบรหัสนี้ ลอง POOL10 หรือ SAVE500'}
    else x.coupon=code;
    renderCard();return;
  }
  if(a==='tobook'){var c=$('#bookcard');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(a==='go'){var q=curQuote();if(q&&q.free&&q.minOk&&q.gOk){S.view='checkout';renderOverlay()}return}
  if(a==='back'){stopHold();S.view='detail';renderOverlay();return}
  if(a==='restart'){stopHold();S.view='detail';S.sel.checkin='';S.sel.checkout='';renderOverlay();return}
  if(a==='pay'){pay();return}
  if(a==='copyref'){
    var ref=S.doneRef;
    function fallback(){var r=document.createRange();r.selectNodeContents($('#refv'));var sel=getSelection();sel.removeAllRanges();sel.addRange(r);t.textContent='เลือกข้อความแล้ว'}
    try{navigator.clipboard.writeText(ref).then(function(){t.textContent='คัดลอกแล้ว'},fallback)}catch(err){fallback()}
  }
});
ov.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='cp'){S.sel.couponText=t.value;return}
  var f=t.getAttribute&&t.getAttribute('data-f');
  if(f&&(t.tagName==='INPUT'&&(t.type==='text'||t.type==='email'||t.type==='tel'||!t.type)||t.tagName==='TEXTAREA')){S.form[f]=t.value}
});
ov.addEventListener('change',function(e){
  var t=e.target,ad=t.getAttribute&&t.getAttribute('data-add');
  if(ad){S.sel.adds[ad]=t.checked;renderCard();return}
  var f=t.getAttribute&&t.getAttribute('data-f');
  if(!f)return;
  if(t.type==='checkbox'){S.form[f]=t.checked}
  else{S.form[f]=t.value}
  if(f==='mode'||f==='method'){renderOverlay2()}
});
function renderOverlay2(){
  var y=ov.scrollTop;renderOverlay();ov.scrollTop=y;
  /* keep the countdown running after a partial re-render */
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!ov.hidden){location.hash='home'}
});

/* ---------- router ---------- */
function route(){
  var h=location.hash.replace('#','');
  var m=/^villa-(\d+)$/.exec(h);
  if(m){
    if(!S.page)showHome();
    openVilla(+m[1]);
    return;
  }
  hideOverlay();
  if(h==='bookings'){S.cancelOpen='';showBookings()}
  else{if(S.page!=='home')showHome();else renderResults()}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
updateNavCount();
route();
})();
</script>
</body>
</html>
